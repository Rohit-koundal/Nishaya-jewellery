<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/nishaya-jewellery-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6d1f34" />
    <meta
      name="description"
      content="Jewellery products from Nishaya Jewellery."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/nishaya-jewellery-logo.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nishaya Jeweller" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Nishaya Jewellery</title>
    <style>
      .store-startup { box-sizing: border-box; min-height: 70vh; max-width: 30rem; margin: 0 auto; padding: 22vh 24px 40px; text-align: center; color: #392a2e; font: 16px/1.6 system-ui, sans-serif; }
      .store-startup__brand { color: #6d1f34; font-size: 13px; font-weight: 600; letter-spacing: .18em; }
      .store-startup h1 { margin: 16px 0 8px; font-size: 22px; font-weight: 600; }
      .store-startup__retry { display: inline-block; margin-top: 16px; border: 0; border-radius: 8px; padding: 10px 20px; background: #6d1f34; color: #fff; font: inherit; text-decoration: none; cursor: pointer; }
      .store-startup__retry:focus-visible { outline: 3px solid #aa7b32; outline-offset: 3px; }
      .store-startup__retry[hidden] { display: none; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <main class="store-startup" id="store-startup" role="status" aria-live="polite">
        <p class="store-startup__brand">NISHAYA JEWELLERY</p>
        <h1>Opening the store</h1>
        <p id="store-startup-message">Please wait a moment.</p>
        <a class="store-startup__retry" id="store-startup-retry" href="" hidden>Reload page</a>
      </main>
    </div>
    <!-- Recovery must never become a download dependency of the main app. -->
    <script async src="%PUBLIC_URL%/startup.js"></script>
    <!--
      This HTML file is a template.
      The startup screen remains visible until the app mounts.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
